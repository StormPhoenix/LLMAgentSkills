version: "1.0.0"
emoji: "📈"
displayName: "股票行情查询"

triggers:
  - 股票
  - 股价
  - 行情
  - 大盘
  - K线
  - 涨跌
  - 财报
  - 市盈率
  - 资金流向
  - 涨跌排行
  - 查一下股票
  - 股票行情

tags:
  - 股票
  - 行情
  - 金融
  - A股
  - 港股
  - 美股
  - 财务
  - 数据查询

examples:
  - 茅台现在多少钱
  - 查一下腾讯的股价
  - 苹果和特斯拉的实时行情
  - 看看贵州茅台最近20天的K线
  - 招商银行的财务摘要
  - 今天涨幅榜前20

tools:
  - name: stock_query
    displayName: "股票数据查询"
    description: |
      查询 A 股 / 港股 / 美股的市场数据。纯只读 HTTP 查询，数据来自东方财富（A 股）与腾讯证券（港股/美股）。
      通过 command 参数选择子功能：
      - search: 按名称搜索股票获取代码（如 "茅台"）
      - quote: 实时行情（如 "sh600519"、"hk00700,usAAPL" 逗号分隔多只）
      - kline: K 线数据（如 "sh600519 day 20 qfq"）
      - minute: 分时图（如 "sh600519"）
      - finance: 财务数据，仅 A 股（如 "sh600519 summary"）
      - profile: 公司简况，仅 A 股（如 "sh600519"）
      - news: 新闻资讯，仅 A 股（如 "sh600519"）
      - fund: 资金流向，仅 A 股（如 "sh600519 10"）
      - rank: 涨跌排行（如 "up 20"、"down 10"）
      股票代码必须带市场前缀：沪市 sh、深市 sz、港股 hk、美股 us。
    inputSchema:
      type: object
      properties:
        command:
          type: string
          description: "子命令：search/quote/kline/minute/finance/profile/news/fund/rank"
        args:
          type: string
          description: "命令参数（空格分隔，含空格的参数用引号包裹），如 'sh600519 day 20 qfq'"
      required:
        - command
    riskLevel: SAFE
    capabilities: [network]
    scriptEntry: scripts/stock-query.cjs
