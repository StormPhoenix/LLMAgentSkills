version: "1.0.0"
displayName: "Markdown 转 PDF"
emoji: "📄"
triggers:
  - md转pdf
  - markdown转pdf
  - 导出pdf
  - 生成pdf
  - 转成PDF
  - 文档转PDF
tags:
  - markdown
  - pdf
  - 转换
  - 导出
  - 文档
  - 格式化
examples:
  - 帮我把这个markdown文件转成PDF
  - 把report.md导出为PDF
  - 把这个文档转成PDF格式

tools:
  - name: convert_md_to_pdf
    description: |
      将 Markdown 文件转换为 PDF 文档，支持中日韩文字。
      支持标题、加粗、斜体、列表、表格、代码块等 Markdown 元素。
      自动使用系统 Edge/Chrome 浏览器生成高质量 PDF。
    inputSchema:
      type: object
      properties:
        inputPath:
          type: string
          description: "输入的 Markdown 文件路径"
        outputPath:
          type: string
          description: "输出的 PDF 文件路径（可选，默认与输入同名 .pdf）"
        title:
          type: string
          description: "PDF 文档标题（可选，默认从 Markdown 第一个 H1 提取）"
      required:
        - inputPath
    riskLevel: MODERATE
    scriptEntry: scripts/md_to_pdf.cjs
