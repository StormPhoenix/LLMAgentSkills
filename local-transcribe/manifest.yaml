version: "1.0.0"
displayName: "本地转录"
emoji: "🎙️"
type:
  - skill

tools:
  - name: transcribe_check_env
    displayName: "检查转录服务环境"
    description: |
      检查本地转录服务的运行状态。
      返回服务是否可达、模型是否已加载完毕、ffmpeg 是否可用、推理设备信息。

      使用场景：
      - 转录前确认服务就绪
      - 用户报告转录失败时排查环境问题

      返回结构：
      - reachable: boolean — 服务是否可达
      - model_loaded: boolean — 推理模型是否已加载完毕
      - ffmpeg_available: boolean — 音视频处理工具（ffmpeg）是否可用
      - device: string — 推理设备（"cpu" / "cuda" / "mps"）
      - error: string? — 不可达时的错误信息
    inputSchema:
      type: object
      properties: {}
    riskLevel: SAFE
    scriptEntry: scripts/asr.cjs

  - name: submit_transcribe_job
    displayName: "提交转录任务"
    description: |
      向本地转录服务提交一个异步转录任务，立即返回 job_id，不等待转录完成。

      ⚠️ 重要：转录为极耗时操作（数分钟），此工具只负责提交，不阻塞 Agent 循环。
      提交后请通过以下方式获取结果：
      - 在 Chat 中查询：调用 check_transcribe_job(job_id)
      - 后台自动轮询：让用户创建 Daemon Task（program 执行体），脚本模板见 SKILL.md

      返回结构：
      - success: boolean
      - job_id: string — 任务 ID（如 asr_abc12345），用于后续查询
      - status: "queued" — 任务已进入队列
      - poll_url: string — 查询地址（REST）
      - error: string? — 提交失败时的错误信息
    inputSchema:
      type: object
      properties:
        file_path:
          type: string
          description: "本地媒体文件的绝对路径，支持 mp4/mkv/avi/mp3/m4a/wav"
        output_format:
          type: string
          description: "输出格式：txt（纯文字，默认）或 srt（含时间戳字幕）"
        language:
          type: string
          description: "语言提示：zh（中文）、en（英文）、auto（自动检测，默认）"
      required:
        - file_path
    riskLevel: SAFE
    scriptEntry: scripts/asr.cjs

  - name: check_transcribe_job
    displayName: "查询转录任务"
    description: |
      查询指定转录任务的当前状态和结果，秒级返回，不阻塞 Agent 循环。

      status 含义：
      - queued：任务排队中，等待推理资源
      - running：正在转录
      - done：转录完成，text 字段包含完整结果
      - error：转录失败，error_message 字段包含原因

      返回结构：
      - job_id: string
      - status: string
      - text: string? — 转录结果（仅 status=done 时存在）
      - duration_seconds: number? — 音频时长（仅 done 时存在）
      - elapsed_seconds: number? — 转录耗时（仅 done 时存在）
      - language_detected: string? — 识别语言（仅 done 时存在）
      - error_message: string? — 错误信息（仅 error 时存在）
    inputSchema:
      type: object
      properties:
        job_id:
          type: string
          description: "转录任务 ID，由 submit_transcribe_job 返回（格式：asr_xxxxxxxx）"
      required:
        - job_id
    riskLevel: SAFE
    scriptEntry: scripts/asr.cjs

  - name: list_transcribe_jobs
    displayName: "列出转录任务"
    description: |
      列出所有转录任务的状态摘要（最多 50 条，按提交时间倒序）。
      秒级返回，不阻塞 Agent 循环。

      返回结构：
      - jobs: array — 任务列表，每条含 job_id / status / file_path / submitted_at /
                      finished_at / elapsed_seconds / language_detected /
                      text（前 200 字预览）
      - total: number — 历史任务总数
    inputSchema:
      type: object
      properties: {}
    riskLevel: SAFE
    scriptEntry: scripts/asr.cjs

configs:
  - key: serviceUrl
    label: "转录服务地址"
    type: string
    defaultValue: "http://localhost:8765"
    description: "本地转录服务的根地址。默认 http://localhost:8765，如服务运行在其他地址请修改。"
