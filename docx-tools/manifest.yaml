version: "1.0.0"
displayName: "Word 工具"
emoji: "📃"
alwaysCandidate: false
triggers:
  - Word
  - docx
  - .docx
  - 文档
  - 创建word
  - 读取word
tags:
  - word
  - 文档
  - 编辑
  - 创建
  - 阅读
examples:
  - 帮我创建一个Word文档
  - 读取这个docx文件
  - 生成一份文档报告

tools:
  - name: read_docx
    description: |
      读取 Word 文档（.docx）的文本内容。支持按段落范围分段读取。
    inputSchema:
      type: object
      properties:
        filePath:
          type: string
          description: DOCX 文件的绝对路径
        pages:
          type: string
          description: |
            段落范围："1-20" 读取第1到20段，"all" 读取全部（默认）
      required:
        - filePath
    riskLevel: SAFE
    scriptEntry: scripts/read-docx.cjs

  - name: create_docx
    description: |
      从 Markdown 内容创建 Word 文档（.docx）。支持标题、段落、列表、加粗/斜体。
    inputSchema:
      type: object
      properties:
        filePath:
          type: string
          description: 输出 DOCX 文件的绝对路径
        content:
          type: string
          description: Markdown 格式的文档内容
      required:
        - filePath
        - content
    riskLevel: MODERATE
    scriptEntry: scripts/create-docx.cjs
